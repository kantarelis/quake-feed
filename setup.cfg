; ---------------------------------------------------------------------------
; isort — import sorter (black-compatible)
; ---------------------------------------------------------------------------
[isort]
profile = black
line_length = 120
known_first_party = quake,database,functions,models
multi_line_output = 3
skip = .venv,build,dist,frontend,.mypy_cache,.pytest_cache

; ---------------------------------------------------------------------------
; flake8 — style linter
; ---------------------------------------------------------------------------
[flake8]
max-line-length = 120
extend-ignore =
    E203,
    W503
exclude =
    .git,
    .venv,
    __pycache__,
    build,
    dist,
    frontend,
    .mypy_cache,
    .pytest_cache
per-file-ignores =
    __init__.py:F401

; ---------------------------------------------------------------------------
; mypy — type checker
; ---------------------------------------------------------------------------
[mypy]
python_version = 3.14
strict_optional = True
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
ignore_missing_imports = True
exclude = (^|/)(\.venv|build|dist|frontend|\.mypy_cache|\.pytest_cache)(/|$)

[mypy-tests.*]
disallow_untyped_defs = False
