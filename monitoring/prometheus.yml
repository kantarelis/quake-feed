# Prometheus scrape configuration.
# Targets use docker-compose service names; resolution happens via the
# `quake_platform` user-defined bridge network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: celery_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["celery_worker:8001"]
