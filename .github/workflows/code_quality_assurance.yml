# Static-analysis + test gate for every push and every pull request.
#
# Both jobs install runtime + test/lint deps into a local `.venv` so that the
# `make check` / `make test` commands run identically to local development
# (the Makefile resolves every tool through `.venv/bin/<tool>`).
#
# When DB-dependent tests land (Epic 2+), the `test` job will gain a
# TimescaleDB service container; until then `make test` is a fast no-op
# pytest run.

name: code_quality_assurance

on: [push, pull_request]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt

      - name: Set up Node (for pyright via npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-test.txt

      - name: make check
        run: make check

  test:
    name: test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-test.txt

      - name: make test
        run: make test
