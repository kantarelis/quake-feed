# Static-analysis + test gate for every push and every pull request.
#
# Both jobs install runtime + test/lint deps into a local `.venv` so that the
# `make check` / `make test` commands run identically to local development
# (the Makefile resolves every tool through `.venv/bin/<tool>`).
#
# When DB-dependent tests land (Epic 2+), the `test` job will gain a
# TimescaleDB service container; until then `make test` is a fast no-op
# pytest run.

name: code_quality_assurance

on: [push, pull_request]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt

      - name: Set up Node (for pyright via npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-test.txt

      - name: make check
        run: make check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: make frontend-check
        run: make frontend-check

      - name: make frontend-test
        run: make frontend-test

  test:
    name: test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-test.txt

      - name: make test
        run: make test

  migration-test:
    name: migration-test
    needs: check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://quake:quake@localhost:5432/quake-db?sslmode=disable
    services:
      postgres:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_USER: quake
          POSTGRES_PASSWORD: quake
          POSTGRES_DB: quake-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quake -d quake-db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: dbmate up (cold start)
        run: |
          docker run --rm --network host \
            -v "$PWD/database":/db:ro \
            -e DATABASE_URL \
            amacneil/dbmate:latest \
            --migrations-dir /db/migrations \
            --migrations-table public.schema_migrations \
            up

      - name: dbmate down (roll back newest migration)
        run: |
          docker run --rm --network host \
            -v "$PWD/database":/db:ro \
            -e DATABASE_URL \
            amacneil/dbmate:latest \
            --migrations-dir /db/migrations \
            --migrations-table public.schema_migrations \
            down

      - name: dbmate up (re-apply newest migration)
        run: |
          docker run --rm --network host \
            -v "$PWD/database":/db:ro \
            -e DATABASE_URL \
            amacneil/dbmate:latest \
            --migrations-dir /db/migrations \
            --migrations-table public.schema_migrations \
            up
